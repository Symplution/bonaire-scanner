name: Dagelijkse scrape & deploy

on:
  schedule:
    - cron: '0 9 * * *'   # 05:00 Bonaire-tijd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bonaire-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - run: python build_dashboard.py
      - name: Commit wijzigingen
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bonaire-scanner/data bonaire-scanner/index.html
          git diff --staged --quiet || git commit -m "Dagelijkse update"
          git push
